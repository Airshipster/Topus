name: Check YouTube Videos

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '7,37 * * * *'
  repository_dispatch:
    types: [topus-push]
  workflow_dispatch:
    inputs:
      sync_bot_state:
        description: 'Only sync bot users/subscriptions; do not signal publication'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: topus-publisher
  cancel-in-progress: false

jobs:
  fallback-publisher:
    if: ${{ github.event.inputs.sync_bot_state != 'true' && github.event.client_payload.sync_bot_state != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Shared-lease fallback; healthy primary retains ownership
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TOPUS_WORKER_URL: ${{ secrets.TOPUS_WORKER_URL }}
          TOPUS_WORKER_ADMIN_SECRET: ${{ secrets.TOPUS_WORKER_ADMIN_SECRET }}
          TOPUS_CONTROL_URL: https://topus-publication-control.scitopus.workers.dev
          TOPUS_CONTROL_TOKEN: ${{ secrets.TOPUS_CONTROL_TOKEN }}
          TOPUS_CONTROL_REQUIRED: 'true'
          TOPUS_PUBLISHER_OWNER: github
          TOPUS_RUN_SOURCE: github-fallback
          TOPUS_PUSH_ONLY: auto
          TOPUS_PUSH_DB: ${{ runner.temp }}/topus-push.sqlite3
          TOPUS_DELIVERY_DB: ${{ runner.temp }}/topus-publication.sqlite3
          PYTHONUNBUFFERED: '1'
        run: python src/coordinated_run.py

  sync-bot-state:
    if: ${{ github.event.inputs.sync_bot_state == 'true' || github.event.client_payload.sync_bot_state == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Preserve explicit Apps Script bot-state sync requests
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TOPUS_WORKER_URL: ${{ secrets.TOPUS_WORKER_URL }}
          TOPUS_WORKER_ADMIN_SECRET: ${{ secrets.TOPUS_WORKER_ADMIN_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '8460cfa72309d5c869775d6c38ca41dd'
          CLOUDFLARE_WORKER_SCRIPT_NAME: 'topus-telegram-subscriptions'
        run: python src/sync_bot_state_sheet.py
