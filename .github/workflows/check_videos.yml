name: Check YouTube Videos

on:
  schedule:
    - cron: '7,37 * * * *'
  repository_dispatch:
    types: [topus-push]
  workflow_dispatch:
    inputs:
      sync_bot_state:
        description: 'Only sync bot users/subscriptions; do not signal publication'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: topus-publisher-signal
  cancel-in-progress: false

jobs:
  signal-server:
    if: ${{ github.event.inputs.sync_bot_state != 'true' && github.event.client_payload.sync_bot_state != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Signal the single durable publisher
        env:
          TOPUS_TOKEN: ${{ secrets.TOPUS_WORKER_ADMIN_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 15 --retry 2 \
            -X POST 'https://scitopus.com/topus-watchdog/run' \
            -H "Authorization: Bearer ${TOPUS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"source":"github"}'
      - name: Check publication readiness, not just HTTP liveness
        run: |
          curl --fail --silent --show-error --max-time 15 \
            'https://scitopus.com/topus-watchdog/status'

  sync-bot-state:
    if: ${{ github.event.inputs.sync_bot_state == 'true' || github.event.client_payload.sync_bot_state == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Preserve explicit Apps Script bot-state sync requests
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TOPUS_WORKER_URL: ${{ secrets.TOPUS_WORKER_URL }}
          TOPUS_WORKER_ADMIN_SECRET: ${{ secrets.TOPUS_WORKER_ADMIN_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '8460cfa72309d5c869775d6c38ca41dd'
          CLOUDFLARE_WORKER_SCRIPT_NAME: 'topus-telegram-subscriptions'
        run: python src/sync_bot_state_sheet.py
