name: Verify Worker sync credentials

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify without exposing secrets
        env:
          TOPUS_WORKER_URL: ${{ secrets.TOPUS_WORKER_URL }}
          TOPUS_WORKER_ADMIN_SECRET: ${{ secrets.TOPUS_WORKER_ADMIN_SECRET }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from urllib.parse import urlsplit
          import requests

          url = os.environ['TOPUS_WORKER_URL'].rstrip('/') + '/admin/sheet-state'
          secret = os.environ['TOPUS_WORKER_ADMIN_SECRET']
          response = requests.get(url, headers={'x-admin-secret': secret}, timeout=20)
          print('host=' + urlsplit(url).netloc)
          print('secret_sha256=' + hashlib.sha256(secret.encode()).hexdigest())
          print('http_status=' + str(response.status_code))
          response.raise_for_status()
          PY
